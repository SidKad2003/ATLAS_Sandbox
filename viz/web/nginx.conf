# sim-viz: static site plus proxy to sim-viz-bridge. Runs unprivileged on 8080.
server_tokens off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS, resolved per request so sim-viz starts even while the bridge restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $bridge http://sim-viz-bridge:8000;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'" always;

    location /api/ {
        proxy_pass $bridge;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location /ws/ {
        proxy_pass $bridge;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
